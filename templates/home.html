{{define "home"}}<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{.Site.Title}}</title>
  <meta name="description" content="{{.Site.Description}}">
  <link rel="canonical" href="{{absURL .Site "/"}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{.Site.Title}}">
  <meta property="og:description" content="{{.Site.Description}}">
  <meta property="og:url" content="{{absURL .Site "/"}}">
  <meta property="og:image" content="{{.OGImage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{.Site.Title}}">
  <meta property="og:site_name" content="{{.Site.Title}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{.OGImage}}">
  <meta name="twitter:title" content="{{.Site.Title}}">
  <meta name="twitter:description" content="{{.Site.Description}}">{{with twitterHandle .Site}}
  <meta name="twitter:creator" content="{{.}}">
  <meta name="twitter:site" content="{{.}}">{{end}}
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"{{.Site.Title}}","description":"{{.Site.Description}}","url":"{{absURL .Site "/"}}","author":{"@type":"Person","name":"{{.Site.Author}}"}}</script>
  {{template "head-common" .}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="site-container">
  {{template "site-header" .}}
  {{template "bio-section" .}}
  <main class="article-index-list" id="main">
    {{range .Articles}}<div class="index-row">
      <a href="/posts/{{.Slug}}">
        <span class="index-date"><time datetime="{{rfc3339 .Date}}">{{formatDate .Date}}</time></span>
        <span class="index-symbol-cell"><span class="index-symbol" aria-hidden="true">::</span></span>
        <span class="index-title">{{.Title}}</span>
      </a>
    </div>{{else}}<p class="empty-state">No posts yet.</p>{{end}}
  </main>
  {{template "site-footer" .}}
</div>
</body>
</html>{{end}}
