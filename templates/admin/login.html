{{define "login"}}<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Admin</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="site-container" style="max-width:480px;margin-top:10vh">
<h1 class="article-title-text">Login</h1>
{{if .Error}}<p style="color:var(--accent);font-family:var(--font-mono)">{{.Error}}</p>{{end}}
<form method="post" action="/admin/login" style="display:flex;flex-direction:column;gap:0.75rem;margin-top:1.5rem">
<input name="password" type="password" placeholder="Password" autocomplete="current-password" style="padding:0.5rem;font-family:var(--font-mono)">
<input name="totp" type="text" placeholder="TOTP code" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" style="padding:0.5rem;font-family:var(--font-mono)">
<button type="submit" style="padding:0.5rem 1rem;background:var(--accent-yellow);border:none;font-family:var(--font-sans);font-weight:700;cursor:pointer">Login</button>
</form>
</div>
</body>
</html>{{end}}
