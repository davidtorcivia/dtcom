{{define "login"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Login — Admin</title>
<script src="{{asset "/static/theme.js"}}"></script>
<link rel="stylesheet" href="{{asset "/static/style.css"}}">
<link rel="stylesheet" href="{{asset "/static/admin.css"}}">
{{if .Favicon}}<link rel="icon" href="{{.Favicon}}">{{else}}<link rel="icon" href="{{asset "/static/favicon.svg"}}" type="image/svg+xml">{{end}}
</head>
<body>
<div class="site-container admin-login-container">
<h1 class="article-title-text">Login</h1>
{{with .Error}}<p class="admin-error" role="alert">{{.}}</p>{{end}}
<form method="post" action="/admin/login" class="admin-login-form">
<label class="admin-sr-only" for="password">Password</label>
<input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
<label class="admin-sr-only" for="totp">TOTP code</label>
<input id="totp" name="totp" type="text" placeholder="TOTP code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
<button type="submit">Login</button>
</form>
</div>
</body>
</html>{{end}}
