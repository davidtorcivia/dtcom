{{define "site-edit"}}{{$s := .Site}}
{{template "admin-header" .}}
<main style="margin-top:2rem">
<h2 style="font-family:var(--font-sans);text-transform:uppercase;margin-bottom:1.5rem">Site Config</h2>
<form method="post" action="/admin/site" style="display:flex;flex-direction:column;gap:0.75rem">
<label style="font-family:var(--font-mono);font-size:0.8rem;text-transform:uppercase">Title</label>
<input name="title" value="{{$s.Title}}" style="padding:0.5rem;font-family:var(--font-sans)">
<label style="font-family:var(--font-mono);font-size:0.8rem;text-transform:uppercase">Description</label>
<input name="description" value="{{$s.Description}}" style="padding:0.5rem;font-family:var(--font-sans)">
<label style="font-family:var(--font-mono);font-size:0.8rem;text-transform:uppercase">Bio (one paragraph per line)</label>
<textarea name="bio" style="width:100%;min-height:120px;padding:0.5rem;font-family:var(--font-serif)">{{range $i, $p := $s.Bio}}{{if $i}}

{{end}}{{$p}}{{end}}</textarea>
<p style="font-family:var(--font-mono);font-size:0.75rem;color:var(--text-muted)">Nav, social, and RSS feeds are managed via the REST API.</p>
<button type="submit" style="padding:0.5rem 1.5rem;background:var(--accent-yellow);border:none;font-family:var(--font-sans);font-weight:700;cursor:pointer;width:max-content">Save</button>
</form>
</main>
{{template "admin-footer"}}
{{end}}
